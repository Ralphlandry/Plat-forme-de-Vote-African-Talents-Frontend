services:
  public-site:
    build:
      context: .
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:?Set VITE_API_BASE_URL in the deployment .env file}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PUBLIC_SITE_PORT:-8080}:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
